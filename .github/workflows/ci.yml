name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-22.04
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: airflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio mypy ruff

    - name: Lint with ruff
      run: |
        # Check for syntax errors and undefined names
        ruff check . --select=E9,F63,F7,F82 --show-source
        # Check all files with default settings
        ruff check .

    - name: Format check with ruff
      run: |
        ruff format --check .

    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports api/ spark/ airflow/ producers/
      continue-on-error: true  # Allow type checking to fail initially

    - name: Test with pytest
      env:
        MONKDB_HOST: localhost
        MONKDB_PORT: 27017
        MONKDB_USERNAME: admin
        MONKDB_PASSWORD: password
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: airflow
        POSTGRES_PASSWORD: airflow
        POSTGRES_DB: airflow
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        pytest tests/ -v --cov=api --cov=spark --cov=producers --cov-report=xml --cov-report=html
      continue-on-error: true  # Allow tests to fail initially

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run bandit security scan
      run: |
        bandit -r api/ spark/ producers/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Run safety check
      run: |
        safety check --json --output safety-report.json
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
      if: always()

  docker-build:
    name: Docker Build and Test
    runs-on: ubuntu-22.04
    needs: [lint-and-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./infra/Dockerfile.api
        push: false
        tags: monkdb-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Airflow Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./infra/Dockerfile.airflow
        push: false
        tags: monkdb-airflow:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker Compose configuration
      run: |
        # Test development configuration
        docker-compose -f infra/docker-compose.dev.yml config
        
        # Test QA configuration
        docker-compose -f infra/docker-compose.qa.yml config

    - name: Start services for integration test
      run: |
        # Copy environment file
        cp .env.sample .env
        cp config/dev.yaml.sample config/dev.yaml
        
        # Start core services
        docker-compose -f infra/docker-compose.dev.yml up -d mongodb kafka zookeeper
        
        # Wait for services to be ready
        sleep 30

    - name: Run integration tests
      run: |
        # Test MongoDB connectivity
        docker exec monkdb-dev mongosh --eval "db.adminCommand('ping')"
        
        # Test Kafka connectivity
        docker exec monkdb-kafka-dev kafka-topics --list --bootstrap-server localhost:9092
      continue-on-error: true

    - name: Cleanup
      run: |
        docker-compose -f infra/docker-compose.dev.yml down -v
      if: always()

  documentation:
    name: Documentation Build
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin

    - name: Build documentation
      run: |
        # Create mkdocs.yml if it doesn't exist
        if [ ! -f mkdocs.yml ]; then
          cat > mkdocs.yml << EOF
        site_name: MonkDB Data Platform
        site_description: Production-ready MonkDB + PySpark + Kafka + Airflow data platform
        site_url: https://monkdb-platform.dev
        
        theme:
          name: material
          palette:
            primary: blue
            accent: light-blue
        
        nav:
          - Home: README.md
          - Architecture: docs/architecture.md
          - Code of Conduct: CODE_OF_CONDUCT.md
        
        plugins:
          - search
          - mermaid2
        
        markdown_extensions:
          - admonition
          - codehilite
          - toc:
              permalink: true
        EOF
        fi
        
        # Build documentation
        mkdocs build --strict
      continue-on-error: true

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: site/
      if: success()

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    needs: [lint-and-test, security-scan, docker-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.CONTAINER_REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
      if: env.CONTAINER_REGISTRY != ''

    - name: Build and push images
      if: env.CONTAINER_REGISTRY != ''
      run: |
        # Build and push API image
        docker build -f infra/Dockerfile.api -t ${{ secrets.CONTAINER_REGISTRY }}/monkdb-api:staging .
        docker push ${{ secrets.CONTAINER_REGISTRY }}/monkdb-api:staging
        
        # Build and push Airflow image
        docker build -f infra/Dockerfile.airflow -t ${{ secrets.CONTAINER_REGISTRY }}/monkdb-airflow:staging .
        docker push ${{ secrets.CONTAINER_REGISTRY }}/monkdb-airflow:staging

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # For example: kubectl apply -f k8s/staging/
      continue-on-error: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    needs: [lint-and-test, security-scan, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.CONTAINER_REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
      if: env.CONTAINER_REGISTRY != ''

    - name: Build and push images
      if: env.CONTAINER_REGISTRY != ''
      run: |
        # Build and push API image
        docker build -f infra/Dockerfile.api -t ${{ secrets.CONTAINER_REGISTRY }}/monkdb-api:latest .
        docker push ${{ secrets.CONTAINER_REGISTRY }}/monkdb-api:latest
        
        # Build and push Airflow image
        docker build -f infra/Dockerfile.airflow -t ${{ secrets.CONTAINER_REGISTRY }}/monkdb-airflow:latest .
        docker push ${{ secrets.CONTAINER_REGISTRY }}/monkdb-airflow:latest

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your deployment commands here
        # For example: kubectl apply -f k8s/production/
      continue-on-error: true

  notify:
    name: Notify
    runs-on: ubuntu-22.04
    needs: [lint-and-test, security-scan, docker-build, documentation]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.lint-and-test.result == 'success' && needs.docker-build.result == 'success'
      run: |
        echo "✅ CI/CD pipeline completed successfully!"
        # Add notification logic here (Slack, email, etc.)

    - name: Notify on failure
      if: needs.lint-and-test.result == 'failure' || needs.docker-build.result == 'failure'
      run: |
        echo "❌ CI/CD pipeline failed!"
        # Add notification logic here (Slack, email, etc.)