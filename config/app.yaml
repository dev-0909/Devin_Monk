# MonkDB Data Platform Configuration
app:
  name: "monkdb-data-platform"
  version: "1.0.0"
  description: "Production-ready MonkDB + PySpark + Kafka + Airflow data platform"

# Database Configuration
database:
  monkdb:
    host: "${MONKDB_HOST:localhost}"
    port: "${MONKDB_PORT:27017}"
    database: "${MONKDB_DATABASE:monkdb}"
    username: "${MONKDB_USERNAME:admin}"
    password: "${MONKDB_PASSWORD:password}"
    auth_source: "${MONKDB_AUTH_SOURCE:admin}"
    connection_pool_size: 10
    max_idle_time_ms: 30000
    server_selection_timeout_ms: 5000

  postgres:
    host: "${POSTGRES_HOST:localhost}"
    port: "${POSTGRES_PORT:5432}"
    database: "${POSTGRES_DATABASE:airflow}"
    username: "${POSTGRES_USERNAME:airflow}"
    password: "${POSTGRES_PASSWORD:airflow}"
    pool_size: 5
    max_overflow: 10

# Message Queue Configuration
kafka:
  bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
  client_id: "monkdb-platform"
  consumer_group_id: "monkdb-consumers"
  auto_offset_reset: "earliest"
  enable_auto_commit: true
  auto_commit_interval_ms: 1000
  session_timeout_ms: 30000
  max_poll_records: 500
  topics:
    data_ingestion: "data.ingestion"
    data_processing: "data.processing"
    data_output: "data.output"
    monitoring: "platform.monitoring"

# Spark Configuration
spark:
  app_name: "MonkDB-Spark-Jobs"
  master: "${SPARK_MASTER_URL:spark://localhost:7077}"
  executor_memory: "2g"
  executor_cores: 2
  driver_memory: "1g"
  max_result_size: "1g"
  sql_adaptive_enabled: true
  sql_adaptive_coalesce_partitions_enabled: true
  serializer: "org.apache.spark.serializer.KryoSerializer"
  jars_packages:
    - "org.mongodb.spark:mongo-spark-connector_2.12:10.2.0"
    - "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3"

# Airflow Configuration
airflow:
  dags_folder: "/opt/airflow/dags"
  base_log_folder: "/opt/airflow/logs"
  plugins_folder: "/opt/airflow/plugins"
  executor: "CeleryExecutor"
  parallelism: 32
  dag_concurrency: 16
  max_active_runs_per_dag: 16
  load_examples: false
  catchup_by_default: false
  max_active_tasks_per_dag: 16
  dagbag_import_timeout: 30
  task_runner: "StandardTaskRunner"

# API Configuration
api:
  host: "${API_HOST:0.0.0.0}"
  port: "${API_PORT:8000}"
  debug: "${API_DEBUG:false}"
  reload: "${API_RELOAD:false}"
  workers: "${API_WORKERS:1}"
  secret_key: "${API_SECRET_KEY:your-secret-key-here}"
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  rate_limiting:
    enabled: true
    requests_per_minute: 100

# Logging Configuration
logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    standard:
      format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    json:
      format: "%(asctime)s %(name)s %(levelname)s %(message)s"
      class: "pythonjsonlogger.jsonlogger.JsonFormatter"
  handlers:
    console:
      class: "logging.StreamHandler"
      level: "INFO"
      formatter: "standard"
      stream: "ext://sys.stdout"
    file:
      class: "logging.handlers.RotatingFileHandler"
      level: "INFO"
      formatter: "json"
      filename: "/var/log/monkdb-platform.log"
      maxBytes: 10485760  # 10MB
      backupCount: 5
  loggers:
    "":
      level: "INFO"
      handlers: ["console", "file"]
      propagate: false
    "uvicorn":
      level: "INFO"
      handlers: ["console"]
      propagate: false
    "kafka":
      level: "WARNING"
      handlers: ["console"]
      propagate: false

# Monitoring Configuration
monitoring:
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  health_check:
    enabled: true
    path: "/health"
    timeout: 30
  tracing:
    enabled: false
    jaeger_endpoint: "${JAEGER_ENDPOINT:http://localhost:14268/api/traces}"

# Security Configuration
security:
  encryption:
    algorithm: "AES-256-GCM"
    key_rotation_days: 90
  authentication:
    jwt_secret: "${JWT_SECRET:your-jwt-secret-here}"
    jwt_algorithm: "HS256"
    jwt_expiration_hours: 24
  authorization:
    rbac_enabled: true
    default_role: "viewer"

# Data Processing Configuration
data_processing:
  batch_size: 1000
  max_retries: 3
  retry_delay_seconds: 5
  timeout_seconds: 300
  checkpointing:
    enabled: true
    interval_seconds: 60
    location: "/tmp/checkpoints"

# Environment-specific overrides will be loaded from:
# - config/dev.yaml (development)
# - config/qa.yaml (QA)
# - config/prod.yaml (production)